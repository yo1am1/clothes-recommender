services:
  qdrant:
    image: qdrant/qdrant:v1.19.2   # keep in step with the qdrant-client minor version
    ports: ["6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]

  api:
    build: .
    image: clothes-recommender:local
    env_file: [{ path: .env, required: false }]
    environment:
      QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data:ro
      - hf-cache:/home/app/.cache/huggingface
    depends_on: [qdrant]

  ui:
    image: clothes-recommender:local   # same image as the API, built once
    command: ["streamlit", "run", "src/clothes_recommender/ui.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  qdrant-data:
  hf-cache:
