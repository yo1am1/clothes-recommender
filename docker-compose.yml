version: "3.8"

services:
  streamlit:
    build: .
    container_name: clothes_recommender_streamlit
    command: streamlit run chatbot_streamlit.py --server.port 8501 --server.enableCORS false --server.enableXsrfProtection false
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      # - AWS_ACCESS_KEY_ID=test
      # - AWS_SECRET_ACCESS_KEY=test
      # - AWS_REGION=eu-central-1
      - LOCALSTACK_HOST=localstack
    depends_on:
      - localstack

  fastapi:
    build: .
    container_name: clothes_recommender_fastapi
    command: python chatbot_fastapi.py --host 0.0.0.0 --port 8502 --workers 1
    ports:
      - "8502:8502"
    volumes:
      - .:/app
    environment:
      # - AWS_ACCESS_KEY_ID=test
      # - AWS_SECRET_ACCESS_KEY=test
      # - AWS_REGION=eu-central-1
      - LOCALSTACK_HOST=localstack
    depends_on:
      - localstack

  localstack:
    container_name: "${LOCALSTACK_DOCKER_NAME:-localstack-main}"
    image: localstack/localstack
    ports:
      - "4566:4566"
    environment:
      # - AWS_ACCESS_KEY_ID=test
      # - AWS_SECRET_ACCESS_KEY=test
      # - AWS_REGION=eu-central-1
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - SERVICES=s3
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      # - "/tmp/localstack:/tmp/localstack"
      - ./files:/home/localstack
