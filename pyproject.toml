[project]
name = "clothes-recommender"
version = "0.2.0"
description = "Multimodal fashion recommender: CLIP vector search, personalised recommendations and an LLM shopping assistant."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain>=1.4.5",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "scipy>=1.18.1",
    # Streamlit 1.59 gzip middleware breaks on starlette 1.8 (in-memory images return 500).
    "starlette<1.8",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.59.1",
]
anthropic = [
    "langchain-anthropic>=1.7.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clothes_recommender"]

# CPU-only torch wheels on Linux keep the install (and Docker image) small.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not integration'"
markers = ["integration: needs downloaded models or network"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
